<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087b42">
<title>Reset Password | ZUNE Account</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{
  --green:#087b42;
  --dark:#064d2b;
  --light:#eaf7ef;
  --text:#17251d;
  --muted:#718078;
  --border:#e4ece6;
  --white:#fff;
  --shadow:0 20px 55px rgba(15,70,38,.10);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#f5faf6;
  color:var(--text);
}

a{
  color:var(--green);
  text-decoration:none;
}

.header{
  height:75px;
  padding:0 7%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:white;
  border-bottom:1px solid var(--border);
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-size:23px;
  font-weight:800;
  color:var(--green);
}

.logo{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--green);
  color:white;
  display:grid;
  place-items:center;
  font-size:25px;
  font-weight:900;
}

.header-link{
  font-size:14px;
  font-weight:700;
}

.main{
  min-height:calc(100vh - 75px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:35px 16px;
}

.reset-container{
  width:100%;
  max-width:460px;
  background:white;
  padding:38px;
  border-radius:24px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}

.top-icon{
  width:68px;
  height:68px;
  margin:0 auto 22px;
  display:grid;
  place-items:center;
  border-radius:20px;
  background:var(--light);
  color:var(--green);
  font-size:30px;
}

.heading{
  text-align:center;
  margin-bottom:30px;
}

.heading h1{
  font-size:28px;
  margin-bottom:11px;
}

.heading p{
  font-size:14px;
  color:var(--muted);
  line-height:1.7;
}

.form-group{
  margin-bottom:22px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:9px;
}

.form-group input{
  width:100%;
  height:52px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 15px;
  outline:none;
  font-size:14px;
  background:white;
  color:var(--text);
}

.form-group input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(8,123,66,.09);
}

.submit-btn{
  width:100%;
  height:53px;
  border:0;
  border-radius:12px;
  background:var(--green);
  color:white;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.submit-btn:hover{
  background:var(--dark);
}

.submit-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:17px;
  padding:13px;
  border-radius:11px;
  font-size:13px;
  line-height:1.6;
  overflow-wrap:anywhere;
}

.message.error{
  display:block;
  background:#fff0f0;
  color:#b42318;
}

.message.success{
  display:block;
  background:var(--light);
  color:var(--dark);
}

.bottom-text{
  text-align:center;
  margin-top:25px;
  font-size:13px;
  color:var(--muted);
}

.bottom-text a{
  font-weight:800;
}

.footer{
  text-align:center;
  padding:20px;
  font-size:12px;
  color:var(--muted);
}

@media(max-width:480px){
  .header{
    height:65px;
    padding:0 18px;
  }

  .brand{
    font-size:20px;
  }

  .reset-container{
    padding:28px 20px;
  }

  .heading h1{
    font-size:25px;
  }
}
</style></head><body><header class="header">
  <a href="index.html" class="brand">
    <div class="logo">Z</div>
    ZUNE Account
  </a>  <a href="login.html" class="header-link">
    Sign In
  </a>
</header><main class="main"><section class="reset-container">  <div class="top-icon">↻</div>  <div class="heading">
    <h1>Forgot Password?</h1>
    <p>
      Don't worry. Enter the email address associated
      with your ZUNE Account and we'll send you a
      password reset link.
    </p>
  </div>  <form id="resetForm"><div class="form-group">
  <label for="email">Email Address</label>

  <input
    type="email"
    id="email"
    placeholder="Enter your registered email"
    autocomplete="email"
    required
  >
</div>

<button
  type="submit"
  class="submit-btn"
  id="resetButton"
>
  Send Reset Link
</button>

<div id="message" class="message" role="status"></div>

  </form>  <div class="bottom-text">
    Remember your password?
    <a href="login.html">Back to Sign In</a>
  </div></section></main><footer class="footer">
  © <span id="year"></span> ZUNE Account. All rights reserved.
</footer><script>
/* SUPABASE CONFIGURATION */

const SUPABASE_URL = "https://rpkogiieegqgxqbzwxwo.supabase.co";

const SUPABASE_KEY = "sb_publishable_2TEqZv-NBM9n5knU46ngqA_wqO3V1uf";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* PAGE ELEMENTS */

const resetForm = document.getElementById("resetForm");
const emailInput = document.getElementById("email");
const resetButton = document.getElementById("resetButton");
const messageBox = document.getElementById("message");


/* MESSAGE FUNCTION */

function showMessage(text, type) {
  messageBox.textContent = text;
  messageBox.className = "message " + type;
}


/* PASSWORD RESET */

resetForm.addEventListener("submit", async function(event) {

  event.preventDefault();

  const email = emailInput.value.trim().toLowerCase();

  if (!email) {
    showMessage(
      "Please enter your email address.",
      "error"
    );
    return;
  }

  if (!emailInput.checkValidity()) {
    showMessage(
      "Please enter a valid email address.",
      "error"
    );
    return;
  }

  resetButton.disabled = true;
  resetButton.textContent = "Sending Reset Link...";

  messageBox.className = "message";
  messageBox.textContent = "";

  try {

    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(email, {
        redirectTo:
          "https://mrnehemiah.github.io/zune-account-/reset-password.html"
      });

    if (error) {
      throw error;
    }

    showMessage(
      "If an account exists with this email, a password reset link will be sent. Check your inbox and spam folder.",
      "success"
    );

    resetForm.reset();

  } catch (error) {

    console.error("ZUNE Password Reset Error:", error);

    showMessage(
      error.message || "Unable to send reset link. Please try again.",
      "error"
    );

  } finally {

    resetButton.disabled = false;
    resetButton.textContent = "Send Reset Link";

  }

});


/* FOOTER YEAR */

document.getElementById("year").textContent =
  new Date().getFullYear();

</script>

</body>
</html>
