<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087b42">
  <title>Forgot Password | ZUNE Account</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --green: #087b42;
      --dark-green: #065f32;
      --light-green: #eaf7ef;
      --yellow: #f5c542;
      --text: #18352a;
      --muted: #718078;
      --white: #ffffff;
      --border: #e2ebe5;
      --danger: #c62828;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #d9f5e3, transparent 40%),
        linear-gradient(135deg, #f5fbf7, #eaf7ef);
      display: flex;
      flex-direction: column;
      color: var(--text);
    }

    header {
      width: 100%;
      padding: 22px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--green);
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo {
      width: 43px;
      height: 43px;
      background: var(--green);
      color: white;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 25px;
      font-weight: bold;
      border: 3px solid var(--yellow);
    }

    .header-link {
      text-decoration: none;
      color: var(--green);
      font-size: 14px;
      font-weight: 700;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 18px 55px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: var(--white);
      padding: 38px 30px;
      border-radius: 22px;
      box-shadow: 0 15px 50px rgba(0, 70, 35, 0.09);
      border: 1px solid rgba(255,255,255,0.8);
    }

    .icon-box {
      width: 75px;
      height: 75px;
      margin: 0 auto 22px;
      background: var(--light-green);
      color: var(--green);
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: 34px;
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 12px;
      color: var(--dark-green);
    }

    .description {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 9px;
      color: var(--text);
    }

    input {
      width: 100%;
      height: 53px;
      padding: 0 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      font-size: 15px;
      background: #fbfdfb;
      transition: 0.2s;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(8,123,66,0.1);
    }

    button {
      width: 100%;
      height: 53px;
      margin-top: 22px;
      border: none;
      border-radius: 12px;
      background: var(--green);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: var(--dark-green);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }

    .message.success {
      display: block;
      color: #176b38;
      background: #e9f8ee;
      border: 1px solid #c9ebd3;
    }

    .message.error {
      display: block;
      color: var(--danger);
      background: #fff0f0;
      border: 1px solid #f5cccc;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: var(--green);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    footer {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 480px) {
      header {
        padding: 18px 5%;
      }

      .container {
        padding: 32px 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">
      <div class="logo">Z</div>
      ZUNE
    </div>

    <a href="login.html" class="header-link">Log In</a>
  </header>

  <main>
    <section class="container">

      <div class="icon-box">🔐</div>

      <h1>Forgot Password?</h1>

      <p class="description">
        Don't worry. Enter the email address connected to your
        ZUNE Account and we will send you a password reset link.
      </p>

      <form id="forgotPasswordForm">

        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email address"
          autocomplete="email"
          required
        >

        <button type="submit" id="submitBtn">
          Send Reset Link
        </button>

      </form>

      <div id="message" class="message"></div>

      <a href="login.html" class="back-link">
        ← Back to Login
      </a>

    </section>
  </main>

  <footer>
    © <span id="year"></span> ZUNE Account. All rights reserved.
  </footer>

  <script>
    // SUPABASE CONFIGURATION

    const SUPABASE_URL =
      "https://rpkogiieegqgxqbzwxwo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_2TEqZv-NBM9n5knU46ngqA_wqO3V1uf";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    // PAGE ELEMENTS

    const form = document.getElementById("forgotPasswordForm");
    const emailInput = document.getElementById("email");
    const submitBtn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("message");

    document.getElementById("year").textContent =
      new Date().getFullYear();

    // DISPLAY MESSAGE

    function showMessage(message, type) {
      messageBox.textContent = message;
      messageBox.className = "message " + type;
    }

    // SEND PASSWORD RESET LINK

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const email = emailInput.value.trim();

      if (!email) {
        showMessage("Please enter your email address.", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";

      messageBox.className = "message";
      messageBox.textContent = "";

      try {
        const { error } =
          await supabaseClient.auth.resetPasswordForEmail(
            email,
            {
              redirectTo:
                "https://mrnehemiah.github.io/zune-account-/reset-password.html"
            }
          );

        if (error) {
          throw error;
        }

        showMessage(
          "If an account exists for this email, a password reset link will be sent. Please check your inbox and spam folder.",
          "success"
        );

        form.reset();

      } catch (error) {
        showMessage(
          error.message || "Unable to send reset link. Please try again.",
          "error"
        );

      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send Reset Link";
      }
    });
  </script>

</body>
</html>
