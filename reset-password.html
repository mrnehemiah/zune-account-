<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087b42">
  <title>Reset Password | ZUNE Account</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --green: #087b42;
      --dark-green: #065f32;
      --light-green: #eaf7ef;
      --yellow: #f5c542;
      --text: #18352a;
      --muted: #718078;
      --border: #e2ebe5;
      --white: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #d9f5e3, transparent 40%),
        linear-gradient(135deg, #f5fbf7, #eaf7ef);
      display: flex;
      flex-direction: column;
      color: var(--text);
    }

    header {
      padding: 22px 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--green);
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo {
      width: 43px;
      height: 43px;
      background: var(--green);
      color: white;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 25px;
      font-weight: bold;
      border: 3px solid var(--yellow);
    }

    .header-link {
      color: var(--green);
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 35px 18px 55px;
    }

    .container {
      width: 100%;
      max-width: 450px;
      background: var(--white);
      padding: 38px 30px;
      border-radius: 22px;
      box-shadow: 0 15px 50px rgba(0, 70, 35, 0.09);
    }

    .icon-box {
      width: 75px;
      height: 75px;
      margin: 0 auto 22px;
      background: var(--light-green);
      color: var(--green);
      border-radius: 22px;
      display: grid;
      place-items: center;
      font-size: 34px;
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 12px;
      color: var(--dark-green);
    }

    .description {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .field {
      margin-bottom: 19px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      height: 53px;
      padding: 0 15px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      font-size: 15px;
      background: #fbfdfb;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(8,123,66,0.1);
    }

    button {
      width: 100%;
      height: 53px;
      margin-top: 8px;
      border: none;
      border-radius: 12px;
      background: var(--green);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: var(--dark-green);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }

    .message.success {
      display: block;
      color: #176b38;
      background: #e9f8ee;
      border: 1px solid #c9ebd3;
    }

    .message.error {
      display: block;
      color: #c62828;
      background: #fff0f0;
      border: 1px solid #f5cccc;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: var(--green);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    footer {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 480px) {
      header {
        padding: 18px 5%;
      }

      .container {
        padding: 32px 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">
      <div class="logo">Z</div>
      ZUNE
    </div>

    <a href="login.html" class="header-link">Log In</a>
  </header>

  <main>
    <section class="container">

      <div class="icon-box">🔐</div>

      <h1>Create New Password</h1>

      <p class="description">
        Enter your new password below. Make sure it is secure
        and that you can remember it.
      </p>

      <form id="resetForm">

        <div class="field">
          <label for="password">New Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter new password"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm New Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <button type="submit" id="submitBtn" disabled>
          Checking Reset Link...
        </button>

      </form>

      <div id="message" class="message"></div>

      <a href="login.html" class="back-link">
        ← Back to Login
      </a>

    </section>
  </main>

  <footer>
    © <span id="year"></span> ZUNE Account. All rights reserved.
  </footer>

  <script>
    // SUPABASE CONFIGURATION

    const SUPABASE_URL =
      "https://rpkogiieegqgxqbzwxwo.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_2TEqZv-NBM9n5knU46ngqA_wqO3V1uf";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    // PAGE ELEMENTS

    const form = document.getElementById("resetForm");
    const passwordInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirmPassword");
    const submitBtn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("message");

    document.getElementById("year").textContent =
      new Date().getFullYear();

    let recoveryReady = false;
    let recoveryError = false;

    function showMessage(message, type) {
      messageBox.textContent = message;
      messageBox.className = "message " + type;
    }

    function showInvalidLink(message) {
      recoveryReady = false;
      recoveryError = true;
      submitBtn.disabled = true;
      submitBtn.textContent = "Reset Link Invalid";
      showMessage(message, "error");
    }

    // VERIFY PASSWORD RECOVERY SESSION

    async function initializeRecovery() {
      try {
        const { data, error } =
          await supabaseClient.auth.getSession();

        if (error) throw error;

        if (!data.session) {
          showInvalidLink(
            "This password reset link is invalid or expired. Please request a new reset link."
          );
          return;
        }

        recoveryReady = true;
        submitBtn.disabled = false;
        submitBtn.textContent = "Update Password";

        showMessage(
          "Your reset link is valid. You can now create a new password.",
          "success"
        );

      } catch (error) {
        showInvalidLink(
          error.message || "Unable to verify your reset link."
        );
      }
    }

    // LISTEN FOR PASSWORD RECOVERY

    supabaseClient.auth.onAuthStateChange(
      async function(event, session) {

        if (event === "PASSWORD_RECOVERY" && session) {
          recoveryReady = true;
          recoveryError = false;
          submitBtn.disabled = false;
          submitBtn.textContent = "Update Password";

          showMessage(
            "Your reset link is valid. Enter your new password.",
            "success"
          );
        }

        if (event === "SIGNED_OUT") {
          recoveryReady = false;
        }
      }
    );

    initializeRecovery();

    // UPDATE PASSWORD

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      if (!recoveryReady || recoveryError) {
        showMessage(
          "Your reset session is not valid. Request a new reset link.",
          "error"
        );
        return;
      }

      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (password.length < 8) {
        showMessage(
          "Your password must contain at least 8 characters.",
          "error"
        );
        return;
      }

      if (password !== confirmPassword) {
        showMessage(
          "The passwords do not match.",
          "error"
        );
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Updating Password...";

      try {
        const { error } =
          await supabaseClient.auth.updateUser({
            password: password
          });

        if (error) throw error;

        recoveryReady = false;

        showMessage(
          "Your password has been updated successfully. You can now log in with your new password.",
          "success"
        );

        form.reset();

        submitBtn.textContent = "Password Updated";

        setTimeout(function() {
          window.location.href = "login.html";
        }, 3000);

      } catch (error) {
        showMessage(
          error.message || "Unable to update password. Please try again.",
          "error"
        );

        submitBtn.disabled = false;
        submitBtn.textContent = "Update Password";
      }
    });
  </script>

</body>
</html>
