<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087b42">
<meta name="description" content="Sign in to your ZUNE Account. One identity, all ZUNE services.">
<title>Sign In | ZUNE Account</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{
  --green:#087b42;
  --dark:#064d2b;
  --light:#eaf7ef;
  --gold:#e9b949;
  --text:#17251d;
  --muted:#718078;
  --border:#e4ece6;
  --white:#ffffff;
  --shadow:0 20px 55px rgba(15,70,38,.10);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#f5faf6;
  color:var(--text);
}

a{
  color:var(--green);
  text-decoration:none;
}

.header{
  height:75px;
  padding:0 7%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:white;
  border-bottom:1px solid var(--border);
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-size:23px;
  font-weight:800;
  color:var(--green);
}

.logo{
  width:42px;
  height:42px;
  border-radius:50%;
  background:var(--green);
  color:white;
  display:grid;
  place-items:center;
  font-size:25px;
  font-weight:900;
}

.header-link{
  font-size:14px;
  font-weight:700;
}

.main{
  min-height:calc(100vh - 75px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:35px 16px;
}

.login-container{
  width:100%;
  max-width:470px;
  background:white;
  padding:38px;
  border-radius:24px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}

.top-icon{
  width:65px;
  height:65px;
  margin:0 auto 20px;
  display:grid;
  place-items:center;
  border-radius:20px;
  background:var(--light);
  color:var(--green);
  font-size:29px;
}

.heading{
  text-align:center;
  margin-bottom:30px;
}

.heading h1{
  font-size:29px;
  margin-bottom:10px;
}

.heading p{
  font-size:14px;
  color:var(--muted);
  line-height:1.7;
}

.form-group{
  margin-bottom:21px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:9px;
}

.form-group input{
  width:100%;
  height:52px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 15px;
  outline:none;
  font-size:14px;
  background:white;
  color:var(--text);
  transition:.2s;
}

.form-group input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(8,123,66,.09);
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:75px;
}

.toggle-password{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:var(--green);
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}

.forgot{
  text-align:right;
  margin-top:-7px;
  margin-bottom:23px;
  font-size:13px;
  font-weight:700;
}

.submit-btn{
  width:100%;
  height:53px;
  border:0;
  border-radius:12px;
  background:var(--green);
  color:white;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.submit-btn:hover{
  background:var(--dark);
  transform:translateY(-1px);
}

.submit-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
  transform:none;
}

.message{
  display:none;
  margin-top:17px;
  padding:13px;
  border-radius:11px;
  font-size:13px;
  line-height:1.6;
  overflow-wrap:anywhere;
}

.message.error{
  display:block;
  background:#fff0f0;
  color:#b42318;
}

.message.success{
  display:block;
  background:var(--light);
  color:var(--dark);
}

.divider{
  display:flex;
  align-items:center;
  gap:13px;
  margin:25px 0;
  color:#9aa69e;
  font-size:12px;
}

.divider:before,
.divider:after{
  content:"";
  height:1px;
  flex:1;
  background:var(--border);
}

.bottom-text{
  text-align:center;
  font-size:13px;
  color:var(--muted);
  line-height:1.8;
}

.bottom-text a{
  font-weight:800;
}

.footer{
  text-align:center;
  padding:20px;
  font-size:12px;
  color:var(--muted);
}

.footer a{
  margin:0 7px;
}

@media(max-width:480px){
  .header{
    height:65px;
    padding:0 18px;
  }

  .brand{
    font-size:20px;
  }

  .logo{
    width:37px;
    height:37px;
  }

  .login-container{
    padding:28px 20px;
    border-radius:19px;
  }

  .heading h1{
    font-size:26px;
  }
}
</style></head><body><header class="header">
  <a href="index.html" class="brand">
    <div class="logo">Z</div>
    ZUNE Account
  </a>  <a class="header-link" href="signup.html">
    Create Account
  </a>
</header><main class="main"><section class="login-container">  <div class="top-icon">↗</div>  <div class="heading">
    <h1>Welcome Back</h1>
    <p>
      Sign in to your ZUNE Account and access your
      ZUNE services with one identity.
    </p>
  </div>  <form id="loginForm"><div class="form-group">
  <label for="email">Email Address</label>
  <input
    type="email"
    id="email"
    placeholder="Enter your email address"
    autocomplete="email"
    required
  >
</div>

<div class="form-group">
  <label for="password">Password</label>

  <div class="password-wrap">
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <button
      type="button"
      class="toggle-password"
      id="togglePassword"
    >
      Show
    </button>
  </div>
</div>

<div class="forgot">
  <a href="forgot-password.html">Forgot Password?</a>
</div>

<button
  type="submit"
  class="submit-btn"
  id="loginButton"
>
  Sign In to ZUNE
</button>

<div id="message" class="message" role="status"></div>

  </form>  <div class="divider">YOUR ZUNE IDENTITY</div>  <div class="bottom-text">
    Don't have a ZUNE Account?<br>
    <a href="signup.html">Create your account</a>
  </div></section></main><footer class="footer">
  <div>
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
  </div>
  <p style="margin-top:12px;">
    © <span id="year"></span> ZUNE Account. All rights reserved.
  </p>
</footer><script>
/* SUPABASE CONFIGURATION */

const SUPABASE_URL =
  "https://rpkogiieegqgxqbzwxwo.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_2TEqZv-NBM9n5knU46ngqA_wqO3V1uf";

const MARKETPLACE_URL =
  "https://mrnehemiah.github.io/ZUNE/";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

/* ELEMENTS */

const loginForm = document.getElementById("loginForm");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");

/* MESSAGE */

function showMessage(text,type){
  message.textContent = text;
  message.className = "message " + type;
}

/* SHOW / HIDE PASSWORD */

togglePassword.addEventListener("click",()=>{
  if(passwordInput.type === "password"){
    passwordInput.type = "text";
    togglePassword.textContent = "Hide";
  }else{
    passwordInput.type = "password";
    togglePassword.textContent = "Show";
  }
});

/* LOGIN WITH SUPABASE */

loginForm.addEventListener("submit",async(event)=>{
  event.preventDefault();

  const email = document
    .getElementById("email")
    .value.trim()
    .toLowerCase();

  const password = passwordInput.value;

  if(!email || !password){
    showMessage(
      "Please enter your email and password.",
      "error"
    );
    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "Signing in...";

  try{

    const {data,error} =
      await supabaseClient.auth.signInWithPassword({
        email:email,
        password:password
      });

    if(error) throw error;

    if(!data.user || !data.session){
      throw new Error("Login session could not be created.");
    }

    showMessage(
      "Login successful! Redirecting to ZUNE Marketplace...",
      "success"
    );

    loginButton.textContent = "Welcome to ZUNE";

    setTimeout(()=>{
      window.location.replace(MARKETPLACE_URL);
    },1200);

  }catch(error){

    showMessage(
      error.message || "Unable to sign in. Please try again.",
      "error"
    );

    loginButton.disabled = false;
    loginButton.textContent = "Sign In to ZUNE";
  }
});

/* FOOTER YEAR */

document.getElementById("year").textContent =
  new Date().getFullYear();

</script></body>
</html>
