
<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087443">
  <title>Ingia | ZUNE Account</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f7f4;
      color: #183027;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid #e0e9e3;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 12px 35px #153d2610;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #087443;
      font-size: 23px;
      font-weight: 800;
    }

    .logo {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      background: #087443;
      color: white;
      border-radius: 50%;
      font-size: 25px;
    }

    h1 { margin: 28px 0 8px; font-size: 27px; }

    .sub {
      color: #68766d;
      line-height: 1.6;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d4dfd7;
      border-radius: 10px;
      font-size: 16px;
      outline-color: #087443;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 10px;
      background: #087443;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .links {
      margin-top: 22px;
      text-align: center;
      font-size: 14px;
      line-height: 2;
    }

    a { color: #087443; }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #68766d;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="logo">Z</div>
      ZUNE Account
    </div>

    <h1>Karibu tena</h1>
    <p class="sub">
      Ingia kwa akaunti yako ya ZUNE Marketplace
      ili kuendelea kutumia huduma zako.
    </p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        placeholder="jina@example.com"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        placeholder="Weka password yako"
        required
      >

      <button id="loginButton" type="submit">
        Ingia kwenye akaunti
      </button>
    </form>

    <div id="message" class="message" role="status"></div>

    <div class="links">
      <a href="signup.html">Tengeneza akaunti</a>
      <br>
      <a href="forgot-password.html">Umesahau password?</a>
    </div>

    <a class="back" href="index.html">
      ← Rudi ZUNE Account
    </a>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
