<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#075c40">

  <title>Log In | ZUNE Account</title>

  <style>
    :root {
      --green: #087c50;
      --dark-green: #064b36;
      --light-green: #edf8f1;
      --text: #172b22;
      --muted: #6b7c72;
      --border: #e1eae4;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f8f5;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 440px;
    }

    .card {
      padding: 30px 24px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: var(--white);
      box-shadow: 0 12px 38px rgba(6, 75, 54, 0.07);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
      color: var(--dark-green);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .logo {
      width: 45px;
      height: 45px;
      display: grid;
      place-items: center;
      position: relative;
      border-radius: 50%;
      background: var(--dark-green);
      color: white;
      font-size: 27px;
    }

    .logo::after {
      content: "";
      position: absolute;
      top: 5px;
      right: 4px;
      width: 7px;
      height: 7px;
      border-radius: 2px;
      background: #f49a38;
    }

    h1 {
      margin: 0 0 10px;
      text-align: center;
      color: var(--dark-green);
      font-size: 27px;
    }

    .description {
      margin: 0 0 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 10px;
      background: var(--light-green);
      color: var(--dark-green);
      font-size: 14px;
      line-height: 1.6;
    }

    .message.visible {
      display: block;
    }

    .actions {
      display: grid;
      gap: 13px;
    }

    .action-button {
      width: 100%;
      min-height: 54px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      border-radius: 12px;
      background: var(--green);
      color: white;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s;
    }

    .action-button:hover {
      background: var(--dark-green);
    }

    .action-button.secondary {
      border: 1px solid var(--green);
      background: white;
      color: var(--green);
    }

    .action-button.secondary:hover {
      background: var(--light-green);
    }

    .icon {
      font-size: 21px;
    }

    .security {
      margin-top: 22px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
    }

    .footer {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 380px) {
      .card {
        padding: 25px 18px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card">

      <div class="brand">
        <span class="logo" aria-hidden="true">Z</span>
        <span>ZUNE ACCOUNT</span>
      </div>
      <section id="loginSection">
        <h1>Karibu ZUNE Account</h1>

        <p class="description">
          Ingia kwenye akaunti yako ili kufikia taarifa zako
          na kuendelea kutumia huduma za ZUNE.
        </p>

        <div
          id="loginMessage"
          class="message"
          role="status"
          aria-live="polite"
        ></div>


        <div id="loginFormPlaceholder" hidden></div>
      </section>

  
      <section id="accountActions" hidden>
        <h1>Umeingia kwa Mafanikio!</h1>

        <p class="description">
          Chagua unachotaka kufanya.
        </p>

        <div class="actions">
          <a
            id="myAccountButton"
            class="action-button"
            href="account.html"
          >
            <span class="icon" aria-hidden="true">👤</span>
            <span>Taarifa Zangu</span>
          </a>

          <a
            id="marketplaceButton"
            class="action-button secondary"
            href="https://mrnehemiah.github.io/"
          >
            <span class="icon" aria-hidden="true">🛍️</span>
            <span>Ingia ZUNE Marketplace</span>
          </a>
        </div>

        <p class="security">
          Taarifa zako binafsi zinaonekana ndani ya akaunti yako.
        </p>
      </section>

    </section>

    <p class="footer">
      © <span id="currentYear"></span> ZUNE Account
    </p>
  </main>

  <script>
    document.getElementById("currentYear").textContent =
      new Date().getFullYear();
  </script>
  <script src="login.js" defer></script>
</body>
</html>
