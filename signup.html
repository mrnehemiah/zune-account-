<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087b42">
<title>Create Account | ZUNE Account</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{
  --green:#087b42;
  --dark:#064d2b;
  --light:#eaf7ef;
  --gold:#e9b949;
  --text:#17251d;
  --muted:#718078;
  --border:#e4ece6;
  --white:#fff;
  --shadow:0 15px 45px rgba(15,70,38,.09);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  background:#f5faf6;
  color:var(--text);
}

a{
  color:var(--green);
  text-decoration:none;
}

.header{
  height:75px;
  padding:0 7%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:white;
  border-bottom:1px solid var(--border);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:23px;
  font-weight:800;
  color:var(--green);
}

.logo{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--green);
  color:white;
  display:grid;
  place-items:center;
  font-size:24px;
  font-weight:900;
}

.header-link{
  font-size:14px;
  font-weight:600;
}

.main{
  min-height:calc(100vh - 75px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:35px 16px;
}

.signup-container{
  width:100%;
  max-width:490px;
  background:white;
  padding:35px;
  border-radius:22px;
  box-shadow:var(--shadow);
  border:1px solid var(--border);
}

.heading{
  text-align:center;
  margin-bottom:27px;
}

.heading h1{
  font-size:29px;
  margin-bottom:9px;
}

.heading p{
  font-size:14px;
  color:var(--muted);
  line-height:1.6;
}

.form-group{
  margin-bottom:17px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:8px;
}

.form-group input{
  width:100%;
  height:49px;
  border:1px solid var(--border);
  border-radius:11px;
  padding:0 14px;
  outline:none;
  font-size:14px;
  background:#fff;
  color:var(--text);
}

.form-group input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(8,123,66,.09);
}

.phone-row{
  display:flex;
  gap:9px;
}

.phone-row select{
  width:115px;
  height:49px;
  border:1px solid var(--border);
  border-radius:11px;
  padding:0 8px;
  background:white;
  outline:none;
}

.phone-row input{
  flex:1;
  min-width:0;
}

.password-wrap{
  position:relative;
}

.password-wrap input{
  padding-right:65px;
}

.toggle-password{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  border:0;
  background:none;
  color:var(--green);
  font-size:12px;
  font-weight:700;
  cursor:pointer;
}

.policy{
  display:flex;
  gap:10px;
  align-items:flex-start;
  margin:20px 0;
  font-size:12px;
  line-height:1.6;
  color:var(--muted);
}

.policy input{
  margin-top:3px;
  accent-color:var(--green);
}

.submit-btn{
  width:100%;
  height:51px;
  border:0;
  border-radius:12px;
  background:var(--green);
  color:white;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.submit-btn:hover{
  background:var(--dark);
}

.submit-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:16px;
  padding:12px;
  border-radius:10px;
  font-size:13px;
  line-height:1.5;
}

.message.error{
  display:block;
  background:#fff0f0;
  color:#b42318;
}

.message.success{
  display:block;
  background:var(--light);
  color:var(--dark);
}

.bottom-text{
  text-align:center;
  margin-top:22px;
  font-size:13px;
  color:var(--muted);
}

@media(max-width:480px){
  .header{padding:0 18px;height:65px}
  .signup-container{padding:25px 19px}
  .heading h1{font-size:25px}
}
</style></head><body><header class="header">
  <div class="brand">
    <div class="logo">Z</div>
    ZUNE Account
  </div>
  <a class="header-link" href="login.html">Sign In</a>
</header><main class="main">
<section class="signup-container">  <div class="heading">
    <h1>Create your account</h1>
    <p>One identity. All ZUNE services. Join the ZUNE community today.</p>
  </div>  <form id="signupForm"><div class="form-group">
  <label for="fullName">Full Name</label>
  <input
    type="text"
    id="fullName"
    placeholder="Enter your full name"
    autocomplete="name"
    required
  >
</div>

<div class="form-group">
  <label for="email">Email Address</label>
  <input
    type="email"
    id="email"
    placeholder="example@email.com"
    autocomplete="email"
    required
  >
</div>

<div class="form-group">
  <label for="phone">Phone Number</label>
  <div class="phone-row">
    <select id="countryCode">
      <option value="+255">🇹🇿 +255</option>
      <option value="+254">🇰🇪 +254</option>
      <option value="+256">🇺🇬 +256</option>
      <option value="+1">🇺🇸 +1</option>
      <option value="+44">🇬🇧 +44</option>
      <option value="+91">🇮🇳 +91</option>
      <option value="+86">🇨🇳 +86</option>
      <option value="+27">🇿🇦 +27</option>
    </select>

    <input
      type="tel"
      id="phone"
      placeholder="712345678"
      autocomplete="tel-national"
      required
    >
  </div>
</div>

<div class="form-group">
  <label for="password">Password</label>
  <div class="password-wrap">
    <input
      type="password"
      id="password"
      placeholder="Create a strong password"
      autocomplete="new-password"
      minlength="8"
      required
    >
    <button type="button" class="toggle-password" data-target="password">Show</button>
  </div>
</div>

<div class="form-group">
  <label for="confirmPassword">Confirm Password</label>
  <div class="password-wrap">
    <input
      type="password"
      id="confirmPassword"
      placeholder="Enter password again"
      autocomplete="new-password"
      required
    >
    <button type="button" class="toggle-password" data-target="confirmPassword">Show</button>
  </div>
</div>

<label class="policy">
  <input type="checkbox" id="acceptPolicy" required>
  <span>
    I agree to the
    <a href="terms.html" target="_blank">Terms of Service</a>
    and
    <a href="privacy.html" target="_blank">Privacy Policy</a>.
  </span>
</label>

<button type="submit" class="submit-btn" id="signupButton">
  Create ZUNE Account
</button>

<div id="message" class="message"></div>

  </form>  <div class="bottom-text">
    Already have an account?
    <a href="login.html"><strong>Sign in</strong></a>
  </div></section>
</main>
<script>
const SUPABASE_URL = "https://rpkogiieegqgxqbzwxwo.supabase.co";

const SUPABASE_KEY = "sb_publishable_2TEqZv-NBM9n5knU46ngqA_wqO3V1uf";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const MARKETPLACE_URL = "https://mrnehemiah.github.io/ZUNE/";

const form = document.getElementById("signupForm");
const button = document.getElementById("signupButton");
const message = document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
}

// Show / Hide password
document.querySelectorAll(".toggle-password").forEach(btn => {
  btn.addEventListener("click", () => {
    const field = document.getElementById(btn.dataset.target);

    if (field.type === "password") {
      field.type = "text";
      btn.textContent = "Hide";
    } else {
      field.type = "password";
      btn.textContent = "Show";
    }
  });
});

// SIGN UP
form.addEventListener("submit", async (event) => {
  event.preventDefault();

  const fullName = document.getElementById("fullName").value.trim();
  const email = document.getElementById("email").value.trim().toLowerCase();
  const countryCode = document.getElementById("countryCode").value;
  const phoneInput = document.getElementById("phone").value.trim();

  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  const phoneDigits = phoneInput.replace(/\D/g, "");

  if (!fullName || !email || !phoneDigits || !password) {
    showMessage("Please complete all required fields.", "error");
    return;
  }

  if (phoneDigits.length < 6 || phoneDigits.length > 15) {
    showMessage("Please enter a valid phone number.", "error");
    return;
  }

  if (password.length < 8) {
    showMessage("Password must contain at least 8 characters.", "error");
    return;
  }

  if (password !== confirmPassword) {
    showMessage("Passwords do not match.", "error");
    return;
  }

  if (!document.getElementById("acceptPolicy").checked) {
    showMessage("Please accept the Terms and Privacy Policy.", "error");
    return;
  }

  const fullPhone = countryCode + phoneDigits;

  button.disabled = true;
  button.textContent = "Creating account...";

  try {
    // CREATE SUPABASE ACCOUNT
    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: {
        data: {
          full_name: fullName,
          phone_number: fullPhone
        }
      }
    });

    if (error) throw error;

    if (!data.user) {
      throw new Error("Account creation failed.");
    }

    // No email confirmation / OTP should be required.
    if (!data.session) {
      throw new Error(
        "Account created, but email confirmation is enabled. Disable Confirm email in Supabase Auth settings."
      );
    }

    // SAVE USER PROFILE
    const { error: profileError } = await supabaseClient
      .from("profiles")
      .upsert({
        id: data.user.id,
        full_name: fullName,
        email: email,
        phone_number: fullPhone
      }, {
        onConflict: "id"
      });

    if (profileError) {
      throw new Error(
        "Account created, but profile saving failed: " +
        profileError.message
      );
    }

    showMessage(
      "Account created successfully! Redirecting to ZUNE Marketplace...",
      "success"
    );

    // REDIRECT TO ZUNE MARKETPLACE
    setTimeout(() => {
      window.location.replace(MARKETPLACE_URL);
    }, 1500);

  } catch (error) {
    showMessage(
      error.message || "Something went wrong. Please try again.",
      "error"
    );

    button.disabled = false;
    button.textContent = "Create ZUNE Account";
  }
});
</script>

</body>
</html>
